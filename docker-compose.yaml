services:
  remote-docker:
    image: ${DESKTOP_PLUGIN_IMAGE}
    volumes:
      # Mount SSH directory read-only. The backend only reads private keys,
      # known_hosts, and config. The :ro flag prevents any writes.
      - ~/.ssh:/root/.ssh:ro
      # Plugin data
      - "remote-docker:/root/docker-extension/"

volumes:
  remote-docker: